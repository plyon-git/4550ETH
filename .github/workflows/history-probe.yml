name: ETH historical data availability probe
on:
  push:
    branches: [research/history-recovery]
    paths: [.github/workflows/history-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and checksum public historical samples
        shell: python
        run: |
          import concurrent.futures, hashlib, io, json, urllib.request, zipfile
          base = 'https://data.binance.vision/data/futures/um/monthly/'
          paths = [
              'klines/ETHUSDT/1m/ETHUSDT-1m-2021-01.zip',
              'markPriceKlines/ETHUSDT/1m/ETHUSDT-1m-2021-01.zip',
              'fundingRate/ETHUSDT/ETHUSDT-fundingRate-2021-01.zip',
              'klines/ETHUSDT/1m/ETHUSDT-1m-2026-08.zip'
          ]
          def probe(path):
              result = {'path': path}
              try:
                  with urllib.request.urlopen(base + path, timeout=20) as response:
                      payload = response.read(20000000)
                  with urllib.request.urlopen(base + path + '.CHECKSUM', timeout=20) as response:
                      expected = response.read(4096).decode().split()[0].lower()
                  actual = hashlib.sha256(payload).hexdigest()
                  result.update(bytes=len(payload), sha256=actual, checksum_matches=actual == expected)
                  if actual != expected:
                      raise ValueError('Checksum mismatch')
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      names = archive.namelist()
                      with archive.open(names[0]) as member:
                          result['first_rows'] = [member.readline().decode().strip() for _ in range(3)]
                  result['success'] = True
              except Exception as exc:
                  result.update(success=False, error=repr(exc))
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(probe, paths))
          print('ETH_ARCHIVE_PROBE_JSON=' + json.dumps(results, sort_keys=True))
