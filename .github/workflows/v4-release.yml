name: Verify V4 execution and reproduce 152-week research
on:
  push:
    branches: [execution-v4]
    paths:
      - 'execution_v4/trader/**'
      - 'execution_v4/research/**'
      - 'execution_v4/tests/**'
      - 'execution_v4/requirements*.txt'
      - '.github/workflows/v4-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v4-research-publication
  cancel-in-progress: false
jobs:
  test-reproduce-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution-v4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned packages and test real-order code with fake transport only
        working-directory: execution_v4
        run: |
          python -m pip install -r requirements-test.txt
          mkdir -p checks
          python -m pytest -q --junitxml=checks/pytest.xml | tee checks/tests.txt
      - name: Restore durable release inputs when a previous release exists
        shell: bash
        run: |
          mkdir -p recovery execution_v4/data
          gh release download v4-research-20260922 --pattern '*_aligned_repaired.npz' --dir recovery || true
          gh release download v4-research-20260922 --pattern 'data-provenance.zip' --dir recovery || true
          for symbol in ETHUSDT BTCUSDT XRPUSDT; do
            mkdir -p "execution_v4/data/$symbol"
            if test -f "recovery/${symbol}_aligned_repaired.npz"; then mv "recovery/${symbol}_aligned_repaired.npz" "execution_v4/data/$symbol/aligned_repaired.npz"; fi
          done
          if test -f recovery/data-provenance.zip; then unzip -q recovery/data-provenance.zip -d execution_v4; fi
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('execution_v4/data/ETHUSDT/aligned_repaired.npz') == '' }}
        with:
          name: v4-repaired-ETHUSDT
          run-id: 35684699873
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: execution_v4/data/ETHUSDT
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('execution_v4/data/BTCUSDT/aligned_repaired.npz') == '' }}
        with:
          name: v4-repaired-BTCUSDT
          run-id: 35684699873
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: execution_v4/data/BTCUSDT
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('execution_v4/data/XRPUSDT/aligned_repaired.npz') == '' }}
        with:
          name: v4-repaired-XRPUSDT
          run-id: 35684699873
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: execution_v4/data/XRPUSDT
      - name: Verify all data identities and retain repair receipts
        working-directory: execution_v4
        run: |
          python -m research.package_release --data-root data --data-only > checks/DATA_SHA256.json
          for symbol in ETHUSDT BTCUSDT XRPUSDT; do
            mkdir -p "data_provenance/$symbol"
            find "data/$symbol" -maxdepth 1 -type f \( -name '*.json' -o -name '*.csv' \) -exec cp {} "data_provenance/$symbol/" \;
          done
      - name: Reproduce grids, models, every trade and independent equity audits
        working-directory: execution_v4
        run: python -u -m research.release --data-root data | tee checks/research-run.txt
      - name: Check against local reproduction and package complete program
        working-directory: execution_v4
        run: python -m research.package_release --data-root data --zip-out "$RUNNER_TEMP/V4_Execution_Research.zip" > "$RUNNER_TEMP/final-package-receipt.json"
      - name: Commit generated weights, all trade evidence and reporting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution_v4/results execution_v4/evidence_repaired execution_v4/configs execution_v4/checks execution_v4/data_provenance execution_v4/ASSESSMENT.json execution_v4/ALL_EVALUATION_CASES.csv execution_v4/RELEASE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit -m 'Save Parrish Lyon V4 fitted models, all 152-week trades, independent audits and honest target assessment'; git push origin HEAD:execution-v4; fi
      - name: Publish durable large-data and complete-code release assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v4-assets"
          for symbol in ETHUSDT BTCUSDT XRPUSDT; do cp "execution_v4/data/$symbol/aligned_repaired.npz" "$RUNNER_TEMP/v4-assets/${symbol}_aligned_repaired.npz"; done
          (cd execution_v4 && zip -qr "$RUNNER_TEMP/v4-assets/data-provenance.zip" data_provenance)
          printf '%s\n' 'Project: Parrish Lyon V4 live execution and 152-week research.' 'Actual production order paths implemented; no authenticated demo/live exchange order test in this session.' 'No tested strategy meets the requested 200% annualized and rolling-year target. See ASSESSMENT.json.' 'Large datasets are preserved here; code, numerical model weights, every trade and audits are in execution-v4.' > "$RUNNER_TEMP/release-notes.txt"
          if ! gh release view v4-research-20260922 >/dev/null 2>&1; then gh release create v4-research-20260922 --target "$(git rev-parse HEAD)" --title 'V4 execution and audited 152-week research' --notes-file "$RUNNER_TEMP/release-notes.txt"; fi
          gh release upload v4-research-20260922 "$RUNNER_TEMP/V4_Execution_Research.zip" "$RUNNER_TEMP/final-package-receipt.json" "$RUNNER_TEMP/v4-assets/"* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-complete-program-and-verification
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/V4_Execution_Research.zip
            ${{ runner.temp }}/final-package-receipt.json
            execution_v4/checks
