name: V5 actual implied volatility data
on:
  push:
    branches: [volatility-v5]
    paths: ['volatility_v5/acquire_iv.py','.github/workflows/v5-iv-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python volatility_v5/acquire_iv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-implied-volatility
          retention-days: 30
          path: volatility_v5/iv_data
