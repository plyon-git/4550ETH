name: V5 reproduce five-year IV research and all trade evidence
on:
  push:
    branches: [volatility-v5]
    paths: ['volatility_v5/source/**','volatility_v5/tests/**','volatility_v5/bootstrap_engine.py','volatility_v5/run_all.py','.github/workflows/v5-research.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v5-research-publication
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: volatility-v5
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical packages, reproduce separate kernel
        run: |
          python -m pip install -r volatility_v5/requirements.txt
          python volatility_v5/bootstrap_engine.py
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('volatility_v5/iv_data/ETH_1D.csv') == '' }}
        with:
          name: v5-implied-volatility
          run-id: 35761424368
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: volatility_v5/iv_data
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('volatility_v5/equity_data/SPY_daily.csv') == '' }}
        with:
          name: v5-equity-daily-inputs
          run-id: 35762934957
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: volatility_v5/equity_data
      - name: Obtain immutable public-market release inputs, not trading credentials
        run: |
          mkdir -p recovery
          gh release download v4-research-20260922 --pattern '*_aligned_repaired.npz' --dir recovery
          for symbol in ETHUSDT BTCUSDT XRPUSDT; do
            mkdir -p "volatility_v5/data/$symbol"
            mv "recovery/${symbol}_aligned_repaired.npz" "volatility_v5/data/$symbol/aligned_repaired.npz"
          done
      - name: Sequential experiments, model refits, every trade, audits and tests
        run: python -u volatility_v5/run_all.py
      - name: Package and verify every generated file
        run: python volatility_v5/source/assemble.py --zip "$RUNNER_TEMP/V5_Volatility_Research.zip" > "$RUNNER_TEMP/V5_Receipt.json"
      - name: Commit all source, models, trades, timestamps and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add volatility_v5/source/engine.py volatility_v5/results volatility_v5/iv_data volatility_v5/equity_data volatility_v5/ASSESSMENT.json volatility_v5/VERIFICATION.json volatility_v5/MANIFEST.json volatility_v5/ALL_RESULTS.csv volatility_v5/FEE_ARITHMETIC.json volatility_v5/RESULTS.md
          if ! git diff --cached --quiet; then git commit -m 'Save Parrish Lyon actual-IV five-year experiments, every trade, causal models and failed-target assessment'; git push origin HEAD:volatility-v5; fi
      - name: Publish reproducible research bundle without live trading
        run: |
          printf '%s\n' 'Parrish Lyon V5: five calendar years and separate250-week volatility research.' 'Actual BTC/ETH IV, explicit range proxies, SPY/QQQ daily diagnostics, causal adaptive/ML tests.' 'No tested case established65% CAGR plus200trades. No live orders.' 'Large underlying inputs remain in the immutable V4 research release; small IV/equity snapshots are included.' > "$RUNNER_TEMP/V5_NOTES.txt"
          if ! gh release view v5-volatility-20260922 >/dev/null 2>&1; then gh release create v5-volatility-20260922 --target "$(git rev-parse HEAD)" --title 'V5 actual-IV five-year research and full evidence' --notes-file "$RUNNER_TEMP/V5_NOTES.txt"; fi
          gh release upload v5-volatility-20260922 "$RUNNER_TEMP/V5_Volatility_Research.zip" "$RUNNER_TEMP/V5_Receipt.json" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-research-complete
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/V5_Volatility_Research.zip
            ${{ runner.temp }}/V5_Receipt.json
            volatility_v5/VERIFICATION.json
            volatility_v5/results/TESTS.xml
