name: Sourced ETHUSDT history with explicit mark gaps
on:
  push:
    branches: [research/history-recovery]
    paths: [tools/acquire_history.py, tools/acquire_with_repairs.py, tools/export_with_mark_gaps.py, .github/workflows/extended-history.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded data dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Preserve missing marks as nulls and export independent observed bounds
        run: python tools/export_with_mark_gaps.py
      - name: Export sourced inputs and explicit coverage limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eth-history-observed-with-mark-gaps
          path: history_output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
