name: Verified extended ETHUSDT history
on:
  push:
    branches: [research/history-recovery]
    paths: [tools/acquire_history.py, .github/workflows/extended-history.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded data dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Fetch and verify archived candles, marks, and funding
        run: python tools/acquire_history.py
      - name: Export verified inputs and data-quality receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-extended-eth-history
          path: history_output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
