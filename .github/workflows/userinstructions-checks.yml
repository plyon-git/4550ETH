name: Verify user instructions and offline reproduction
on:
  push:
    branches: [main]
    paths:
      - 'USERINSTRUCTIONS/**'
      - '.github/workflows/userinstructions-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned reproduction dependencies
        run: python -m pip install -r USERINSTRUCTIONS/requirements-reproduction.txt
      - name: Test the read-only installation diagnostic
        run: python -m unittest discover -s USERINSTRUCTIONS -p 'test_*.py' -v
      - name: Verify original source and historical input identities
        run: python USERINSTRUCTIONS/check_installation.py > installation-check.json
      - name: Verify that live capability is explicitly unavailable
        shell: bash
        run: |
          set +e
          python USERINSTRUCTIONS/check_installation.py --require-live > live-readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c "import json; d=json.load(open('live-readiness.json')); assert d['status']=='LIVE_NOT_IMPLEMENTED' and d['live_order_submission'] is False"
      - name: Reproduce every original simulated trade
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python reproduce_saved.py
      - name: Save verification receipts, never credentials or live trades
        uses: actions/upload-artifact@v4
        with:
          name: userinstructions-offline-verification
          retention-days: 30
          path: |
            installation-check.json
            live-readiness.json
            reproduced/REPRODUCTION_VERIFICATION.json
