name: V5 daily equity and index volatility comparison inputs
on:
  push:
    branches: [volatility-v5]
    paths: ['volatility_v5/acquire_equities.py','.github/workflows/v5-equity-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python volatility_v5/acquire_equities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-equity-daily-inputs
          retention-days: 30
          path: volatility_v5/equity_data
