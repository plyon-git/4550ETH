name: V4 read-only BTC XRP historical data
on:
  push:
    branches: [execution-v4]
    paths: ['execution_v4/research/acquire.py', '.github/workflows/v4-public-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Acquire actual public trade mark and funding archives
        run: python execution_v4/research/acquire.py --symbol ${{ matrix.symbol }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-market-${{ matrix.symbol }}
          retention-days: 30
          compression-level: 0
          path: |
            market_data/${{ matrix.symbol }}/aligned.npz
            market_data/${{ matrix.symbol }}/*.json
            market_data/${{ matrix.symbol }}/*.csv
